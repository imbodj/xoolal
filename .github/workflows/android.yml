name: Build Xoolal Android
on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev
          pip install buildozer cython kivy

      - name: Create main.py
        run: |
          cat > main.py << 'EOF'
          from kivy.app import App
          from kivy.uix.boxlayout import BoxLayout
          from kivy.uix.textinput import TextInput
          from kivy.uix.button import Button
          from kivy.uix.label import Label
          from kivy.core.window import Window
          from kivy.utils import get_color_from_hex
          from android.permissions import request_permissions, Permission

          MOTEURS = {
              "Google":     "https://www.google.com/search?q=",
              "DuckDuckGo": "https://duckduckgo.com/?q=",
              "Qwant":      "https://www.qwant.com/?q=",
          }
          MOTEUR_ACTUEL = "Google"
          VERT  = get_color_from_hex("#00853F")
          JAUNE = get_color_from_hex("#FDEF42")
          ROUGE = get_color_from_hex("#E31B23")
          NOIR  = get_color_from_hex("#1a1a1a")
          BLANC = get_color_from_hex("#FFFFFF")

          class XoolalApp(App):
              def build(self):
                  Window.clearcolor = NOIR
                  self.title = "Xoolal"
                  layout = BoxLayout(orientation='vertical')
                  barre = BoxLayout(size_hint_y=None, height=60, spacing=5, padding=5)
                  btn_retour = Button(text="◀", size_hint_x=None, width=50, background_color=VERT)
                  barre.add_widget(btn_retour)
                  self.url_bar = TextInput(
                      hint_text="🔍 Rechercher ou URL...",
                      multiline=False, background_color=BLANC, foreground_color=NOIR)
                  self.url_bar.bind(on_text_validate=self.naviguer)
                  barre.add_widget(self.url_bar)
                  btn_go = Button(text="▶", size_hint_x=None, width=50, background_color=ROUGE)
                  btn_go.bind(on_press=self.naviguer)
                  barre.add_widget(btn_go)
                  layout.add_widget(barre)
                  from kivy.uix.webview import WebView
                  self.webview = WebView(url="https://imbodj.github.io/xoolal", size_hint_y=1)
                  layout.add_widget(self.webview)
                  label = Label(
                      text="🇸🇳 Xoolal — © 2024 Ismaïla Mbodji",
                      size_hint_y=None, height=25, font_size=11, color=JAUNE)
                  layout.add_widget(label)
                  return layout

              def naviguer(self, instance=None):
                  texte = self.url_bar.text.strip()
                  if not texte:
                      return
                  if "." in texte and " " not in texte:
                      if not texte.startswith("http"):
                          texte = "https://" + texte
                      self.webview.url = texte
                  else:
                      self.webview.url = MOTEURS[MOTEUR_ACTUEL] + texte.replace(" ", "+")

          if __name__ == "__main__":
              XoolalApp().run()
          EOF

      - name: Create buildozer.spec
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = Xoolal Browser
          package.name = xoolal
          package.domain = sn.xoolal
          source.dir = .
          source.include_exts = py,png
          version = 1.4
          requirements = python3,kivy,openssl
          orientation = portrait
          android.permissions = INTERNET
          android.api = 33
          android.minapi = 21
          android.archs = arm64-v8a
          [buildozer]
          log_level = 2
          EOF

      - name: Copy icon
        run: cp xoolal_icon.png icon.png

      - name: Accept Android licenses
        run: |
          yes | sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" || true

      - name: Build APK
        run: |
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Xoolal-Android
          path: bin/*.apk
